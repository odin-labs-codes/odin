name: CI

permissions: {}

on:
  push:
  pull_request:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Check the combination matrix is up to date
        run: |
          node tools/gen-combinations.mjs
          git diff --exit-code -- test/mocks/Combinations.sol

      - name: Run Forge tests
        run: forge test -vvv
